
services:
  db:
    image: postgres:16-alpine
    container_name: taskforge_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskforge_db}
      POSTGRES_USER: ${POSTGRES_USER:-taskforge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}

    ports:
      - "127.0.0.1:5436:5432"

    volumes:
      - taskforge_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    container_name: taskforge_backend
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    environment:
      APP_NAME: ${APP_NAME:-TaskForge}
      APP_ENV: development
      DEBUG: "false"

      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in root .env}

      FRONTEND_BASE_URL: http://localhost:8080
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    container_name: taskforge_frontend

    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api

    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    depends_on:
      backend:
        condition: service_healthy

volumes:
  taskforge_postgres_data:
    name: taskforge_postgres_data
